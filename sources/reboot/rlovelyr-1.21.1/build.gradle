plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.146' apply false
}

subprojects {
    apply plugin: 'java'
    
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    jar {
        manifest {
            attributes([
                "Specification-Title": "${mod_id}",
                "Specification-Vendor": "${mod_authors}",
                "Specification-Version": "1",
                "Implementation-Title": "${mod_name}",
                "Implementation-Version": "${mod_version}",
                "Implementation-Vendor": "${mod_authors}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
    }

    repositories {
        mavenCentral()
        
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupAndSubgroups('com.geckolib')
            }
        }
        
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        
        flatDir {
            dirs rootProject.file('libs')
        }
        
        if (rootProject.hasProperty('lovelylib_project_path')) {
            def lovelylibBase = rootProject.file(rootProject.lovelylib_project_path)
            flatDir {
                dirs new File(lovelylibBase, 'Common/build/libs')
                dirs new File(lovelylibBase, 'Fabric/build/libs')
                dirs new File(lovelylibBase, 'Forge/build/libs')
                dirs new File(lovelylibBase, 'NeoForge/build/libs')
            }
        }

        if (rootProject.hasProperty('hzlib_project_path')) {
            def hzlibBase = rootProject.file(rootProject.hzlib_project_path)
            flatDir {
                dirs new File(hzlibBase, 'Common/build/libs')
                dirs new File(hzlibBase, 'Fabric/build/libs')
                dirs new File(hzlibBase, 'Forge/build/libs')
                dirs new File(hzlibBase, 'NeoForge/build/libs')
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 25
    }

    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }
    
    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}

def runGradleBuild(File projectDir) {
    def gradlew = new File(projectDir, 'gradlew')
    if (!gradlew.exists()) {
        throw new GradleException("Gradle wrapper not found at: ${gradlew}")
    }

    def process = new ProcessBuilder(gradlew.absolutePath, 'build')
            .directory(projectDir)
            .redirectErrorStream(true)
            .inheritIO()
            .start()

    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Gradle build failed in ${projectDir} with exit code ${exitCode}")
    }
}

task refreshDependencies {
    description = 'Build HZLib first, then LovelyLib, and copy both libraries into local libs directory'
    group = 'dependencies'
    
    doLast {
        def libsDir = file('libs')
        libsDir.mkdirs()

        if (project.hasProperty('hzlib_project_path')) {
            def hzLibProject = file(hzlib_project_path)
            if (!hzLibProject.exists()) {
                throw new GradleException("HZLib project not found at: ${hzlib_project_path}")
            }

            println "Building HZLib first..."
            runGradleBuild(hzLibProject)

            ['Common', 'Fabric', 'Forge', 'NeoForge'].each { loader ->
                def buildDir = file("${hzlib_project_path}/${loader}/build/libs")
                if (buildDir.exists()) {
                    copy {
                        from buildDir
                        into libsDir
                        include '*.jar'
                        exclude '*-sources.jar'
                        exclude '*-javadoc.jar'
                        exclude '*-dev.jar'
                    }
                }
            }
            println "Copied HZLib JARs to libs/"
        }

        if (project.hasProperty('lovelylib_project_path')) {
            def lovelyLibProject = file(lovelylib_project_path)
            if (!lovelyLibProject.exists()) {
                throw new GradleException("LovelyLib project not found at: ${lovelylib_project_path}")
            }

            println "Building LovelyLib..."
            runGradleBuild(lovelyLibProject)

            ['Common', 'Fabric', 'Forge', 'NeoForge'].each { loader ->
                def buildDir = file("${lovelylib_project_path}/${loader}/build/libs")
                if (buildDir.exists()) {
                    copy {
                        from buildDir
                        into libsDir
                        include '*.jar'
                        exclude '*-sources.jar'
                        exclude '*-javadoc.jar'
                        exclude '*-dev.jar'
                    }
                }
            }
            println "Copied LovelyLib JARs to libs/"
        }
    }
}

task buildWithDeps {
    description = 'Refresh dependencies and build the project'
    group = 'build'
    dependsOn 'refreshDependencies', 'build'
}

task runClientWithDeps {
    description = 'Refresh dependencies and run client'
    group = 'application'
    dependsOn 'refreshDependencies'
    
    doLast {
        if (project.findProject(':Fabric')) {
            project(':Fabric').tasks.runClient.execute()
        } else if (project.findProject(':Forge')) {
            project(':Forge').tasks.runClient.execute()
        } else if (project.findProject(':NeoForge')) {
            project(':NeoForge').tasks.runClient.execute()
        } else {
            throw new GradleException("No loader subproject found to run client")
        }
    }
}