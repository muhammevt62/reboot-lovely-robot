name: Port 26.1.2 Build

on:
  push:
    branches: ["port-26.1.2"]
  workflow_dispatch:

jobs:
  baseline-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sources/reboot/rlovelyr-1.21.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrappers executable
        working-directory: .
        run: find sources -name gradlew -type f -exec chmod +x {} \;
      - name: Patch 26.1.2 vanilla API names
        working-directory: .
        run: |
          find sources/common/hzlib-1.21.1 sources/common/lovelylib-1.21.1 sources/reboot/rlovelyr-1.21.1 -type f -name '*.java' -print0 | while IFS= read -r -d '' f; do
            sed -i \
              -e 's/net\.minecraft\.resources\.ResourceLocation/net.minecraft.resources.Identifier/g' \
              -e 's/\bResourceLocation\b/Identifier/g' \
              -e 's/net\.minecraft\.world\.entity\.MobSpawnType/net.minecraft.world.entity.EntitySpawnReason/g' \
              -e 's/\bMobSpawnType\b/EntitySpawnReason/g' \
              -e 's/net\.minecraft\.util\.FastColor/net.minecraft.util.ARGB/g' \
              -e 's/\bFastColor\b/ARGB/g' \
              -e 's/\.isClientSide\b/.isClientSide()/g' \
              -e 's/\bgetOwnerUUID()\b/getOwnerReference().getUUID()/g' \
              -e 's/\.getDayTime()/\.getGameTime()/g' \
              -e 's/\.getType()\.is(\([^)]*\))/\.getType().builtInRegistryHolder().is(\1)/g' \
              -e 's/ARGB\.ARGB32\.color/ARGB.color/g' \
              -e 's/Ingredient\.EMPTY/Ingredient.of()/g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('sources/common/hzlib-1.21.1'), Path('sources/common/lovelylib-1.21.1'), Path('sources/reboot/rlovelyr-1.21.1')]
          for root in roots:
              for p in root.rglob('*.java'):
                  s = p.read_text()
                  s = s.replace('contains(NBT_COOLDOWNS, Tag.TAG_LIST)', 'contains(NBT_COOLDOWNS)')
                  s = s.replace('contains(key, 10)', 'contains(key)')
                  s = s.replace('getList(NBT_COOLDOWNS, Tag.TAG_COMPOUND)', 'getList(NBT_COOLDOWNS).orElseGet(ListTag::new)')
                  s = re.sub(r'\.getInt\(([^\n(),]+)\)', r'.getInt(\1).orElse(0)', s)
                  s = re.sub(r'\.getLong\(([^\n(),]+)\)', r'.getLong(\1).orElse(0L)', s)
                  s = re.sub(r'\.getFloat\(([^\n(),]+)\)', r'.getFloat(\1).orElse(0.0F)', s)
                  s = re.sub(r'\.getBoolean\(([^\n(),]+)\)', r'.getBoolean(\1).orElse(false)', s)
                  s = re.sub(r'\.getString\(([^\n(),]+)\)', r'.getString(\1).orElse("")', s)
                  s = re.sub(r'\.getCompound\(([^\n(),]+)\)', r'.getCompound(\1).orElseGet(CompoundTag::new)', s)
                  s = s.replace('UUIDUtil.CODEC', 'net.minecraft.core.UUIDUtil.CODEC')
                  s = s.replace('tag.putUUID(key, value);', 'tag.store(key, net.minecraft.core.UUIDUtil.CODEC, value);')
                  s = s.replace('tag.hasUUID(key) ? tag.getUUID(key) : null', 'tag.read(key, net.minecraft.core.UUIDUtil.CODEC).orElse(null)')
                  p.write_text(s)
          PY
      - name: Build HZLib NeoForge
        working-directory: sources/common/hzlib-1.21.1
        env:
          TARGET_LOADER: NeoForge
        run: ./gradlew build --stacktrace
      - name: Stage HZLib for LovelyLib
        working-directory: .
        run: |
          mkdir -p sources/common/lovelylib-1.21.1/libs
          cp sources/common/hzlib-1.21.1/NeoForge/build/libs/hzlib-neoforge-26.1.2-1.0.0.jar sources/common/lovelylib-1.21.1/libs/
      - name: Build LovelyLib NeoForge
        working-directory: sources/common/lovelylib-1.21.1
        env:
          TARGET_LOADER: NeoForge
        run: ./gradlew build --stacktrace
      - name: Stage libraries for Lovely Reboot
        working-directory: .
        run: |
          mkdir -p sources/reboot/rlovelyr-1.21.1/libs
          cp sources/common/hzlib-1.21.1/NeoForge/build/libs/hzlib-neoforge-26.1.2-1.0.0.jar sources/reboot/rlovelyr-1.21.1/libs/
          cp sources/common/lovelylib-1.21.1/NeoForge/build/libs/lovelylib-neoforge-26.1.2-1.0.0.jar sources/reboot/rlovelyr-1.21.1/libs/
      - name: Build NeoForge baseline
        env:
          TARGET_LOADER: NeoForge
        run: ./gradlew build --stacktrace
      - name: Upload NeoForge JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lovely-reboot-neoforge-26.1.2
          path: |
            sources/common/hzlib-1.21.1/NeoForge/build/libs/*.jar
            sources/common/lovelylib-1.21.1/NeoForge/build/libs/*.jar
            sources/reboot/rlovelyr-1.21.1/NeoForge/build/libs/*.jar
          if-no-files-found: error
