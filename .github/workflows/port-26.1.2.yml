name: Port 26.1.2 Build

on:
  push:
    branches: ["port-26.1.2"]
  workflow_dispatch:

jobs:
  baseline-neoforge:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sources/reboot/rlovelyr-1.21.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrappers executable
  working-directory: .
  run: find sources -name gradlew -type f -exec chmod +x {} \;

      - name: Refresh local dependencies
        env:
          TARGET_LOADER: NeoForge
        run: ./gradlew refreshDependencies --stacktrace

      - name: Build NeoForge baseline
        env:
          TARGET_LOADER: NeoForge
        run: ./gradlew build --stacktrace
